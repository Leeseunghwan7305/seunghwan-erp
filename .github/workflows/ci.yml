name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci(엄격)는 mac에서 생성된 lock의 플랫폼별 optional 의존성(@emnapi 등)이
      # linux 러너에 없어 실패 → install로 플랫폼 의존성을 재조정한다.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (Jest)
        run: npm test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Unit tests (pytest)
        run: python -m pytest -q

  rag-eval:
    name: RAG retrieval eval (gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # eval은 커밋된 fixture(rag_fixture.json) 위에서 numpy 코사인만 돈다 — Ollama·DB 불필요.
      - run: pip install numpy
      - name: RAG golden-set eval (통과율 < RAG_EVAL_MIN 이면 실패 → merge 차단)
        env:
          RAG_EVAL_MIN: "0.8"
        run: python eval/run_rag_eval.py
